name: Quidence checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-records-and-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Recompute authored mathematics references
        run: |
          python3 scripts/audit-challenges.py
          python3 scripts/audit-projects.py
          git diff --exit-code -- review/challenge-math-audit.json review/project-math-audit.json
      - name: Check activities, record preservation and source inventory
        run: npm test
      - name: Build the public static bundle
        run: npm run build:static
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check activity layouts, drafts and cached-version upgrades in Chromium
        run: npm run test:browser
      - name: Check bilingual layouts, complete reports and original answer preservation
        run: npm run test:localization:browser
      - name: Check the supplied logo across both languages and offline reports
        run: npm run test:brand:browser
      - name: Check Spanish course evidence, number formats and lazy loading
        run: npm run test:spanish:review

      - name: Check knowledge map, bilingual course navigation and saved evidence
        run: npm run test:home:browser
      - name: Check Number Theory steps, proofs, exports and phone layouts
        run: npm run test:number-theory:browser
      - name: Check real-motion, map criteria and current-note recovery regressions
        run: npm run test:reviewed:browser

      - name: Check all four themes, every public page and remembered preferences
        run: npm run test:themes:browser

      - name: Check illustrated maps, filters and all three new foundation sessions
        run: npm run test:cartoon:browser

      - name: Check Paper Explorer layouts, original links and request preservation
        run: npm run test:paper:browser

      - name: Check Learning Atlas groups, theme round trips and responsive navigation
        run: npm run test:atlas:browser
