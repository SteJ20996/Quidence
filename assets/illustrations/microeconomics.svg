<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Microeconomics</title><desc id="desc">Price is vertical and quantity horizontal. Demand P equals twelve minus Q and supply P equals Q meet at quantity six and price six.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><path d="M65 25V130H275" class="axis"/><path d="M65 25L275 130" class="curve"/><path d="M65 130L275 25" stroke="#087f76" stroke-width="3" stroke-dasharray="6 3" fill="none"/><circle cx="170" cy="77.5" r="5" fill="#a84324"/><text x="170" y="151" text-anchor="middle">Quantity</text><text x="17" y="83" transform="rotate(-90 17 83)" text-anchor="middle">Price</text><text x="240" y="105">Demand</text><text x="226" y="23">Supply</text><text x="218" y="83">(6, 6)</text></svg>
