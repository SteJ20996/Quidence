<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">How many pieces can n cuts make?</title><desc id="desc">A stick, a pizza and a ball, each cut by straight cuts. Three cuts make 4 pieces of the stick and 7 pieces of the pizza. Four cuts make 15 pieces of the ball, not 16, so the count stops doubling.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><text x="160" y="24" text-anchor="middle">1, 2, 4, 8, <tspan fill="#a84324" style="fill:#a84324;font-weight:700">15</tspan>, 26, …</text><path d="M20 84H96" stroke="#087f76" stroke-width="7" stroke-linecap="round"/><path d="M38 72V96" stroke="#a84324" stroke-width="2"/><path d="M57 72V96" stroke="#a84324" stroke-width="2"/><path d="M79 72V96" stroke="#a84324" stroke-width="2"/><circle cx="160" cy="84" r="34" fill="#f6e3c6" stroke="#c9935a" stroke-width="3"/><path d="M190.2 68.3L126.3 79.6" stroke="#142236" stroke-width="1.6"/><path d="M166.3 117.4L134.2 61.8" stroke="#142236" stroke-width="1.6"/><path d="M155.9 117.8L183.2 59.2" stroke="#142236" stroke-width="1.6"/><circle cx="262" cy="84" r="38" fill="#f1edf9" stroke="#6542c0" stroke-width="2.5"/><ellipse cx="262" cy="84" rx="38" ry="11" fill="#e6dcf7" stroke="#6542c0" stroke-width="1.6"/><path d="M243 51Q227 84 243 117" fill="none" stroke="#a84324" stroke-width="2.2"/><path d="M281 51Q296 84 281 117" fill="none" stroke="#6542c0" stroke-width="1.4" stroke-dasharray="4 3"/><text x="58" y="138" text-anchor="middle">L(3) = 4</text><text x="160" y="138" text-anchor="middle">P(3) = 7</text><text x="262" y="138" text-anchor="middle">B(4) = 15</text></svg>
