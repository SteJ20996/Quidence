<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Two puzzles, one sequence</title><desc id="desc">Chords among six points on a circle make 31 regions, and five cuts of a four-dimensional ball make at most 31 pieces. Both puzzles start 1, 2, 4, 8, 16 and then give 31.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><text x="160" y="24" text-anchor="middle">1, 2, 4, 8, 16, <tspan fill="#a84324" style="fill:#a84324;font-weight:700">31</tspan>, 57, …</text><circle cx="100" cy="86" r="48" fill="#f1edf9" stroke="#6542c0" stroke-width="2.5"/><path d="M89.7 132.9L56.3 66.2" stroke="#142236" stroke-width="1.2"/><path d="M89.7 132.9L131.4 49.7" stroke="#142236" stroke-width="1.2"/><path d="M89.7 132.9L89.4 39.2" stroke="#142236" stroke-width="1.2"/><path d="M89.7 132.9L57.3 108.0" stroke="#142236" stroke-width="1.2"/><path d="M89.7 132.9L147.9 88.7" stroke="#142236" stroke-width="1.2"/><path d="M56.3 66.2L131.4 49.7" stroke="#142236" stroke-width="1.2"/><path d="M56.3 66.2L89.4 39.2" stroke="#142236" stroke-width="1.2"/><path d="M56.3 66.2L57.3 108.0" stroke="#142236" stroke-width="1.2"/><path d="M56.3 66.2L147.9 88.7" stroke="#142236" stroke-width="1.2"/><path d="M131.4 49.7L89.4 39.2" stroke="#142236" stroke-width="1.2"/><path d="M131.4 49.7L57.3 108.0" stroke="#142236" stroke-width="1.2"/><path d="M131.4 49.7L147.9 88.7" stroke="#142236" stroke-width="1.2"/><path d="M89.4 39.2L57.3 108.0" stroke="#142236" stroke-width="1.2"/><path d="M89.4 39.2L147.9 88.7" stroke="#142236" stroke-width="1.2"/><path d="M57.3 108.0L147.9 88.7" stroke="#142236" stroke-width="1.2"/><circle cx="89.7" cy="132.9" r="3.5" fill="#a84324"/><circle cx="56.3" cy="66.2" r="3.5" fill="#a84324"/><circle cx="131.4" cy="49.7" r="3.5" fill="#a84324"/><circle cx="89.4" cy="39.2" r="3.5" fill="#a84324"/><circle cx="57.3" cy="108.0" r="3.5" fill="#a84324"/><circle cx="147.9" cy="88.7" r="3.5" fill="#a84324"/><path d="M196 54h56v56h-56Z M224 70h56v56h-56Z M196 54l28 16M252 54l28 16M196 110l28 16M252 110l28 16" fill="none" stroke="#087f76" stroke-width="2"/><text x="100" y="152" text-anchor="middle">R(6) = 31</text><text x="238" y="152" text-anchor="middle">H(5) = 31</text></svg>
