<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="science-title science-desc"><title id="science-title">A rain shadow and a heating curve</title><desc id="science-desc">Wind pushes moist air up the windward slope of a mountain, where it cools, a cloud forms and rain falls, so that side is wet and the far side is dry. Beside it, a heating curve for water, not to scale: the temperature rises, stays flat at 0 °C while ice melts, rises again, and stays flat for longer at 100 °C while water boils.</desc><g font-family="system-ui, sans-serif"><path d="M12 132L172 132" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M52 132L100 58L148 132Z" fill="#e3ecd9" stroke="#5b7a52" stroke-width="2"/><path d="M44 70a12 12 0 0 1 3-22 15 15 0 0 1 28-5 12 12 0 0 1 11 19 9 9 0 0 1-7 8Z" fill="#e6e0f5" stroke="#6542c0" stroke-width="1.6"/><path d="M52 78L47 92" fill="none" stroke="#2147df" stroke-width="2" /><path d="M63 78L58 92" fill="none" stroke="#2147df" stroke-width="2" /><path d="M74 78L69 92" fill="none" stroke="#2147df" stroke-width="2" /><path d="M14 124L44 110" fill="none" stroke="#087f76" stroke-width="3" /><path d="M36.63 117.854L44 110L33.247 110.604" fill="none" stroke="#087f76" stroke-width="3" stroke-linejoin="round"/><text x="12" y="104" fill="#087f76" font-size="13">wind</text><text x="66" y="152" fill="#2147df" font-size="13" text-anchor="middle">wet</text><text x="138" y="152" fill="#a84324" font-size="13" text-anchor="middle">dry</text><path d="M206 132L312 132" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M206 132L206 44" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M210 120L216 112L234 112L262 72L300 72L306 64" fill="none" stroke="#a84324" stroke-width="3" stroke-linejoin="round"/><path d="M201 112L206 112" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M201 72L206 72" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M206 112L216 112" fill="none" stroke="#a8b3c4" stroke-width="1" stroke-dasharray="3 3"/><path d="M206 72L262 72" fill="none" stroke="#a8b3c4" stroke-width="1" stroke-dasharray="3 3"/><text x="198" y="116" fill="#354961" font-size="13" text-anchor="end">0 °C</text><text x="198" y="76" fill="#354961" font-size="13" text-anchor="end">100 °C</text><text x="259" y="152" fill="#354961" font-size="13" text-anchor="middle">energy added</text></g></svg>
