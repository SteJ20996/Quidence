<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Pre-Algebra</title><desc id="desc">A number line starts at minus three and adds five to end at two.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><text x="160" y="20" text-anchor="middle">−3 + 5 = 2</text><path d="M30 75H290" class="axis"/><path d="M56 70V80" class="axis"/><text x="56" y="98" text-anchor="middle">-4</text><path d="M82 70V80" class="axis"/><text x="82" y="98" text-anchor="middle">-3</text><path d="M108 70V80" class="axis"/><text x="108" y="98" text-anchor="middle">-2</text><path d="M134 70V80" class="axis"/><text x="134" y="98" text-anchor="middle">-1</text><path d="M160 70V80" class="axis"/><text x="160" y="98" text-anchor="middle">0</text><path d="M186 70V80" class="axis"/><text x="186" y="98" text-anchor="middle">1</text><path d="M212 70V80" class="axis"/><text x="212" y="98" text-anchor="middle">2</text><path d="M238 70V80" class="axis"/><text x="238" y="98" text-anchor="middle">3</text><path d="M264 70V80" class="axis"/><text x="264" y="98" text-anchor="middle">4</text><path d="M82 50H212" class="curve"/><circle cx="82" cy="50" r="4" fill="#087f76"/><circle cx="212" cy="50" r="5" fill="#a84324"/><text x="160" y="141" text-anchor="middle">Numbers · fractions · ratios</text></svg>
