<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="statistics-title statistics-desc"><title id="statistics-title">Regresión por mínimos cuadrados y residuos</title><desc id="statistics-desc">Ocho observaciones sintéticas tienen la recta exacta de mínimos cuadrados y-hat=2+0.6x. Los segmentos verticales naranjas muestran los residuos e=y-y-hat, también representados alrededor de cero a la derecha. Los residuos varían en signo y magnitud, y ambos paneles utilizan el mismo orden de x. No se implica un intervalo de confianza ni un conjunto de datos del mundo real.</desc><g font-family="system-ui, sans-serif"><text x="12" y="21" fill="#276a9c" text-anchor="start" font-size="16">Regresión y residuos</text><path d="M32 113L204 113" fill="none" stroke="#e2e8ef" stroke-width="1.5" /><path d="M32 89L204 89" fill="none" stroke="#e2e8ef" stroke-width="1.5" /><path d="M32 65L204 65" fill="none" stroke="#e2e8ef" stroke-width="1.5" /><path d="M32 41L204 41" fill="none" stroke="#e2e8ef" stroke-width="1.5" /><path d="M32 137L205 137" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M32 137L32 35" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M32 113L202 51.8" fill="none" stroke="#276a9c" stroke-width="2.7" /><path d="M52 98.9L52 105.8" fill="none" stroke="#a84324" stroke-width="1.7" /><circle cx="52" cy="98.9" r="3.2" fill="#276a9c"/><path d="M72 110.471L72 98.6" fill="none" stroke="#a84324" stroke-width="1.7" /><circle cx="72" cy="110.471" r="3.2" fill="#276a9c"/><path d="M92 88.443L92 91.4" fill="none" stroke="#a84324" stroke-width="1.7" /><circle cx="92" cy="88.443" r="3.2" fill="#276a9c"/><path d="M112 74.814L112 84.2" fill="none" stroke="#a84324" stroke-width="1.7" /><circle cx="112" cy="74.814" r="3.2" fill="#276a9c"/><path d="M132 83.986L132 77" fill="none" stroke="#a84324" stroke-width="1.7" /><circle cx="132" cy="83.986" r="3.2" fill="#276a9c"/><path d="M152 71.557L152 69.8" fill="none" stroke="#a84324" stroke-wi