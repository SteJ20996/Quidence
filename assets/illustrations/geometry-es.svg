<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Geometría</title><desc id="desc">Un triángulo rectángulo con catetos perpendiculares de tres y cuatro tiene hipotenusa cinco. Todas las longitudes utilizan la misma escala.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><path d="M105 126V26L180 126Z" fill="#f1edf9" stroke="#6542c0" stroke-width="2.5"/><path d="M105 114H117V126" class="axis"/><text x="88" y="80">4</text><text x="141" y="145" text-anchor="middle">3</text><text x="154" y="71">5</text><text x="220" y="61">3² + 4² = 5²</text><text x="213" y="89" class="small">Triángulo</text><text x="213" y="104" class="small">rectángulo</text></svg>
