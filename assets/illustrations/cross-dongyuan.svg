<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">One round city, ten right triangles</title><desc id="desc">A round city wall inside a square of roads, with three right triangles around it: a large one around the whole city and two small ones at its eastern corners. The long side of each triangle just touches the wall.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><path d="M73.6 30.6H174.4V131.4H73.6Z" fill="none" stroke="#8595ac" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="124" cy="81" r="50.4" fill="#f1edf9" stroke="#6542c0" stroke-width="2.6"/><path d="M73.6 152.4L73.6 30.6L208.0 30.6L143.0 152.4" fill="none" stroke="#142236" stroke-width="2.2" stroke-linejoin="round"/><path d="M174.4 30.6L208.0 30.6L174.4 93.6Z" fill="#fbe9e3" stroke="#a84324" stroke-width="2"/><path d="M174.4 131.4L154.2 131.4L174.4 93.6Z" fill="#e3f3ee" stroke="#087f76" stroke-width="2"/><text x="266" y="72" text-anchor="middle" style="font-size:15px;font-weight:700">one city</text><text x="266" y="92" text-anchor="middle" class="small">ten walks</text></svg>
