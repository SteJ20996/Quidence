<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="physics-title physics-desc"><title id="physics-title">Motion and momentum</title><desc id="physics-desc">A velocity-time line v=4−2t crosses zero at t=2 s. A separate 1 kg cart at 4 m/s latches with a stationary 3 kg cart, giving 1 m/s.</desc><g font-family="system-ui, sans-serif"><path d="M26 82L175 82" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M42 120L42 35" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path data-motion-line="" d="M42 50L178 114" fill="none" stroke="#6542c0" stroke-width="3"/><circle cx="110" cy="82" r="4" fill="#087f76"/><text x="110" y="141" fill="#354961" text-anchor="middle" font-size="16">2 s</text><text x="22" y="52" fill="#354961" text-anchor="middle" font-size="16">4</text><text x="100" y="20" fill="#354961" text-anchor="middle" font-size="16">v = 4 − 2t</text><rect x="211" y="50" width="35" height="32" rx="4" fill="#eaf0ff" stroke="#2147df"/><rect x="267" y="50" width="35" height="32" rx="4" fill="#eaf0ff" stroke="#2147df"/><text x="229" y="71" fill="#354961" text-anchor="middle" font-size="16">1 kg</text><text x="285" y="71" fill="#354961" text-anchor="middle" font-size="16">3 kg</text><path d="M213 100L246 100" fill="none" stroke="#087f76" stroke-width="3" /><path d="M236 104L246 100L236 96" fill="none" stroke="#087f76" stroke-width="3" stroke-linejoin="round"/><text x="227" y="122" fill="#354961" text-anchor="middle" font-size="16">4 m/s</text><text x="285" y="122" fill="#354961" text-anchor="middle" font-size="16">at rest</text><text x="253" y="151" fill="#354961" text-anchor="middle" font-size="16">vf = 1 m/s</text></g></svg>
