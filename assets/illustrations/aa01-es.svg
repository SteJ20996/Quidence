<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="school-title school-desc"><title id="school-title">Una ecuación, su solución y una recta</title><desc id="school-desc">4x − 3 = 9 tiene solución x = 3. El gráfico de coordenadas muestra y = x + 1 con los puntos (1, 2) y (3, 4).</desc><g font-family="system-ui, sans-serif"><rect x="10" y="24" width="128" height="106" rx="14" fill="#eaf0ff"/><text x="74" y="56" fill="#2147df" text-anchor="middle" font-size="16">4x − 3 = 9</text><path d="M22 91L126 91" fill="none" stroke="#2147df" stroke-width="1.5" /><path d="M57 87L57 96" fill="none" stroke="#2147df" stroke-width="1.5" /><text x="57" y="118" fill="#2147df" text-anchor="middle" font-size="16">1</text><path d="M85 87L85 96" fill="none" stroke="#2147df" stroke-width="1.5" /><text x="85" y="118" fill="#2147df" text-anchor="middle" font-size="16">2</text><path d="M113 87L113 96" fill="none" stroke="#2147df" stroke-width="1.5" /><text x="113" y="118" fill="#2147df" text-anchor="middle" font-size="16">3</text><circle cx="113" cy="91" r="5" fill="#2147df"/><path d="M166 130L307 130" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M180 142L180 21" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M180 113L292 45" fill="none" stroke="#2147df" stroke-width="3" /><circle cx="208" cy="96" r="4" fill="#2147df"/><circle cx="264" cy="62" r="4" fill="#2147df"/><text x="203" y="80" fill="#354961" text-anchor="end" font-size="16">(1, 2)</text><text x="266" y="36" fill="#354961" text-anchor="middle" font-size="16">(3, 4)</text><text x="305" y="150" fill="#354961" text-anchor="end" font-size="16">x</text></g></svg>
