<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="quantitative-title quantitative-desc"><title id="quantitative-title">Estimate, then check</title><desc id="quantitative-desc">A bell curve with its middle and two standard deviations either side marked; a quick estimate, marked with an approximately-equal sign, lands close to the exact value.</desc><g font-family="system-ui, sans-serif"><path d="M24 132C78 132 96 34 140 34S202 132 256 132" fill="#eef3fb" stroke="#276a9c" stroke-width="3"/><path d="M140 34V132" stroke="#88601e" stroke-width="2.5"/><path d="M100 86V132M180 86V132" stroke="#276a9c" stroke-width="2" stroke-dasharray="6 5"/><path d="M24 132H296" stroke="#a8b3c4" stroke-width="2"/><text x="100" y="152" text-anchor="middle" font-size="13" fill="#354961">−2σ</text><text x="180" y="152" text-anchor="middle" font-size="13" fill="#354961">+2σ</text><path d="M232 40h34M232 52h34" stroke="#a84324" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="38" r="6" fill="#a84324"/><text x="249" y="80" text-anchor="middle" font-size="13" fill="#354961">estimate</text></g></svg>
