<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="physics-title physics-desc"><title id="physics-title">Circuitos en paralelo y una imagen real de una lente</title><desc id="physics-desc">Dos cargas ideales en paralelo de 6 y 12 ohmios comparten una fuente de 6 voltios; las corrientes son 1 y 0.5 amperios. Una lente convergente separada tiene u=30 cm, f=10 cm y v=15 cm, lo que da m=−0.5.</desc><g font-family="system-ui, sans-serif"><path d="M28 48L145 48" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M28 104L145 104" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M28 48L28 68" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M28 84L28 104" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M16 68L40 68" fill="none" stroke="#354961" stroke-width="2" /><path d="M21 84L35 84" fill="none" stroke="#354961" stroke-width="2" /><path d="M83 48L83 66" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M83 86L83 104" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><rect x="75" y="66" width="16" height="20" fill="#eef3ff" stroke="#2147df"/><path d="M145 48L145 66" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M145 86L145 104" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><rect x="137" y="66" width="16" height="20" fill="#eef3ff" stroke="#2147df"/><text x="26" y="133" fill="#354961" text-anchor="middle" font-size="16">6 V</text><text x="82" y="30" fill="#354961" text-anchor="middle" font-size="16">6 Ω</text><text x="143" y="30" fill="#354961" text-anchor="middle" font-size="16">12 Ω</text><text x="82" y="133" fill="#354961" text-anchor="middle" font-size="16">1 A</text><text x="143" y="133" fill="#354961" text-anchor="middle" font-size="16">0.5 A</text><path d="M182 80L310 80" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><path d="M252 35L252 120" fill="none" stroke="#2147df" stroke-width="2" /><path d="M192 80L192 40" fill="none" stroke="#6542c0" stroke-width="3" /><path d="M282 80L282 100" fill="none" stroke="#087f76" stroke-width="3" /><circle cx="232" cy="80" r="3" fill="#a84324"/><circle cx="272" cy="80" r="3" fill="#a84324"/><text x="205" y="20" fill="#354961" text-anchor="middle" font-size="16">Objeto</text><text x="282" y="124" fill="#354961" text-anchor="middle" font-size="16">Imagen</text><text x="253" y="151" fill="#354961" text-anchor="middle" font-size="16">m = −0.5</text></g></svg>
