<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Why do so many numbers start with 1?</title><desc id="desc">Nine bars show Benford’s law: the share of numbers whose first digit is d is log base 10 of 1 + 1/d. The bar for the digit 1 is the tallest, and the bars get shorter up to the digit 9.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><text x="160" y="24" text-anchor="middle">P(d) = log₁₀(1 + 1/d)</text><path d="M34 128H290" class="axis"/><rect x="40" y="40.0" width="20" height="88.0" rx="2" fill="#fbe9e3" stroke="#a84324" stroke-width="2.4"/><text x="50" y="146" text-anchor="middle">1</text><rect x="68" y="76.5" width="20" height="51.5" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="78" y="146" text-anchor="middle">2</text><rect x="96" y="91.5" width="20" height="36.5" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="106" y="146" text-anchor="middle">3</text><rect x="124" y="99.7" width="20" height="28.3" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="134" y="146" text-anchor="middle">4</text><rect x="152" y="104.9" width="20" height="23.1" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="162" y="146" text-anchor="middle">5</text><rect x="180" y="108.4" width="20" height="19.6" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="190" y="146" text-anchor="middle">6</text><rect x="208" y="111.0" width="20" height="17.0" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="218" y="146" text-anchor="middle">7</text><rect x="236" y="113.0" width="20" height="15.0" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="246" y="146" text-anchor="middle">8</text><rect x="264" y="114.6" width="20" height="13.4" rx="2" fill="#f1edf9" stroke="#6542c0" stroke-width="1.6"/><text x="274" y="146" text-anchor="middle">9</text></svg>
