<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="title desc"><title id="title">Basic Logic</title><desc id="desc">A truth table shows that if P, then Q is false only when P is true and Q is false. A Venn diagram shows all A are B, with circle A inside circle B.</desc><style>text{font:12px system-ui,sans-serif;fill:#142236}.small{font-size:11px}.axis{stroke:#8595ac;fill:none}.curve{stroke:#6542c0;stroke-width:3;fill:none}</style><rect x="32" y="66" width="146" height="20" rx="3" fill="#fbe9e3"/><path d="M32 42H178M106 22V132" class="axis"/><text x="52" y="36" text-anchor="middle">P</text><text x="86" y="36" text-anchor="middle">Q</text><text x="142" y="36" text-anchor="middle">If P, then Q</text><text x="52" y="58" text-anchor="middle">T</text><text x="86" y="58" text-anchor="middle">T</text><text x="142" y="58" text-anchor="middle">T</text><text x="52" y="80" text-anchor="middle">T</text><text x="86" y="80" text-anchor="middle">F</text><text x="142" y="80" text-anchor="middle" fill="#a84324" style="fill:#a84324;font-weight:700">F</text><text x="52" y="102" text-anchor="middle">F</text><text x="86" y="102" text-anchor="middle">T</text><text x="142" y="102" text-anchor="middle">T</text><text x="52" y="124" text-anchor="middle">F</text><text x="86" y="124" text-anchor="middle">F</text><text x="142" y="124" text-anchor="middle">T</text><circle cx="250" cy="80" r="48" fill="#f1edf9" stroke="#6542c0" stroke-width="2.5"/><circle cx="238" cy="92" r="22" fill="#fff" stroke="#087f76" stroke-width="2.5"/><text x="238" y="96" text-anchor="middle">A</text><text x="270" y="58" text-anchor="middle">B</text><text x="250" y="150" text-anchor="middle">All A are B</text></svg>
