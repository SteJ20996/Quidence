<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img" aria-labelledby="statistics-title statistics-desc"><title id="statistics-title">A distribution with a right tail</title><desc id="statistics-desc">Ten observations at 1, 2, 2, 3, 3, 3, 4, 4, 5, 9. Each dot represents one observation; numeric horizontal spacing is consistent.</desc><g font-family="system-ui, sans-serif"><text x="28" y="24" fill="#276a9c" text-anchor="start" font-size="16">One dot = one observation</text><path d="M27 125L300 125" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><circle cx="55" cy="112" r="7" fill="#276a9c"/><circle cx="83" cy="112" r="7" fill="#276a9c"/><circle cx="83" cy="91" r="7" fill="#276a9c"/><circle cx="111" cy="112" r="7" fill="#276a9c"/><circle cx="111" cy="91" r="7" fill="#276a9c"/><circle cx="111" cy="70" r="7" fill="#276a9c"/><circle cx="139" cy="112" r="7" fill="#276a9c"/><circle cx="139" cy="91" r="7" fill="#276a9c"/><circle cx="167" cy="112" r="7" fill="#276a9c"/><circle cx="279" cy="112" r="7" fill="#276a9c"/><path d="M55 125L55 131" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><text x="55" y="153" fill="#354961" text-anchor="middle" font-size="16">1</text><path d="M111 125L111 131" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><text x="111" y="153" fill="#354961" text-anchor="middle" font-size="16">3</text><path d="M167 125L167 131" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><text x="167" y="153" fill="#354961" text-anchor="middle" font-size="16">5</text><path d="M223 125L223 131" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><text x="223" y="153" fill="#354961" text-anchor="middle" font-size="16">7</text><path d="M279 125L279 131" fill="none" stroke="#a8b3c4" stroke-width="1.5" /><text x="279" y="153" fill="#354961" text-anchor="middle" font-size="16">9</text></g></svg>
