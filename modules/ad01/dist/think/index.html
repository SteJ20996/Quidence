<main><section class="intro"><div><p class="eyebrow">CALCULUS / THINK IN MOTION</p><h1 data-zh="讓你的想法，<br>在圖上走一走。" data-en="Give your thinking<br>room to move."></h1><p class="subtitle" data-zh="先說說你的判斷，再用一個時刻、一段圖形，看看它站不站得住。" data-en="Make a claim. Find a moment on the graph. See where your idea takes you."></p></div><div class="intro-note"><span class="note-star">✳</span><p data-zh="你可以改變主意。<br>這正是探索的一部分。" data-en="You can change your mind.<br>That is part of exploring."></p><span data-zh="約 5–8 分鐘 · 無計時評分" data-en="About 5–8 min · No timed score"></span></div></section>
<nav id="progress" class="progress" aria-label="Progress"></nav>
<div class="workspace"><section class="lab" aria-labelledby="labTitle"><div class="panel-heading"><div><p class="eyebrow" data-zh="你的實驗桌" data-en="YOUR WORKBENCH"></p><h2 id="labTitle" data-zh="一段會折返的騎行" data-en="A ride that turns around"></h2></div><span class="chip" id="modelName">01 / RIDE</span></div><p class="graph-desc" id="modelDesc"></p><div class="legend"><span class="legend-line"></span><span data-zh="速度 v(t)" data-en="Velocity v(t)"></span><span class="legend-point"></span><span data-zh="你選的時刻" data-en="Your selected moment"></span></div><svg id="graph" viewBox="0 0 600 330" role="img" aria-labelledby="graphTitle graphDescription"><title id="graphTitle">Velocity graph</title><desc id="graphDescription"></desc></svg><div class="slider-label"><label for="time" data-zh="移動到一個時刻" data-en="Move to a moment"></label><output id="timeOut" for="time"></output></div><input id="time" type="range" min="0" max="5" step="0.05" value="1"><div class="scale"><span>0 min</span><span>5 min</span></div><div class="metrics"><div><span data-zh="速度" data-en="Velocity"></span><strong id="velocity"></strong><small>m/s</small></div><div><span data-zh="加速度" data-en="Acceleration"></span><strong id="acceleration"></strong><small>m/s²</small></div></div><div class="track"><span data-zh="位置示意（原路往返）" data-en="Position on a straight path"></span><svg id="track" viewBox="0 0 600 65" role="img" aria-label="Position on a straight track"></svg><p id="trackNote"></p></div><button id="capture" class="secondary full" data-zh="＋ 留下這個時刻作為證據" data-en="＋ Keep this moment as evidence"></button><div id="samples"></div><p class="small" data-zh="時間用分鐘；速度用 m/s。加速度已換算為 m/s²。圖上的點也可以直接點選。" data-en="Time is in minutes; velocity in m/s. Acceleration is converted to m/s². You can also select a point on the graph."></p></section>
<section class="conversation" aria-labelledby="conversationTitle"><div class="panel-heading"><div><p class="eyebrow" data-zh="一起想一想" data-en="LET’S THINK IT THROUGH"></p><h2 id="conversationTitle" data-zh="從你的判斷開始" data-en="Start with your idea"></h2></div><span class="live-dot" aria-hidden="true"></span></div><div id="dialogue" aria-live="polite"></div></section></div>
<section class="footnote"><span class="footnote-icon">i</span><div><p data-zh="先選擇或提出自己的說法，再用打字或語音解釋。" data-en="Choose a viewpoint or offer your own, then explain by typing or voice."></p><span data-zh="回應依據選項與圖形。可用錄音回放整理想法，再打字記下要保留的理由。目前不提供自動轉寫或 AI 評閱。文字筆記存於本機；錄音不會上傳，關閉錄音視窗後清除。" data-en="Responses use choices and graph actions. Record and replay to rehearse, then type the reasoning you want to keep. Automatic transcription and AI review are not enabled. Written notes stay in this browser. Audio is never uploaded and is cleared when the recording window closes."></span></div></section><div class="utilities"><span id="saveStatus" role="status"></span><div><button id="export" class="quiet" data-zh="下載探索筆記" data-en="Download field notes"></button><button id="reset" class="quiet" data-zh="重新開始" data-en="Start again"></button></div></div><footer>Quidence · A little evidence. A better question.</footer></main><dialog id="resetDialog"><h2 data-zh="重新開始這次探索？" data-en="Start a fresh exploration?"></h2><p data-zh="這會清除這個 demo 的本機紀錄。你可以先下載探索筆記。" data-en="This clears this demo’s local record. You can download your field notes first."></p><div class="actions"><button id="cancelReset" class="secondary" data-zh="保留紀錄" data-en="Keep my record"></button><button id="confirmReset" class="primary" data-zh="清除並開始" data-en="Clear and start"></button></div></dialog><dialog id="notesDialog"><h2 data-zh="你的探索筆記" data-en="Your field notes"></h2><p class="small" data-zh="可直接複製下方文字，或下載檔案保存。" data-en="Copy the text below, or download a file to keep."></p><label class="field" for="notesText" data-zh="筆記全文" data-en="Full notes"></label><textarea id="notesText" readonly style="min-height:240px"></textarea><div class="actions"><a id="notesLink" class="primary" download="quidence-motion-field-notes.md" data-zh="下載 .md 檔案" data-en="Download .md file"></a><button id="closeNotes" class="secondary" data-zh="返回探索" data-en="Back to exploration"></button></div></dialog><script type="module" src="app.js?v=404781ccd59f"></script></body></html>
