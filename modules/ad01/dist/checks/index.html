</head><body data-q-theme="mist-teal" data-no-translate><main><header class="entry-header"><a class="brand q-brand" href="../../../../?view=courses#subject-ad01"><img class="q-brand-logo" src="../../../../assets/quidence-logo-light.svg?v=f221ab3e9b1a" data-logo-light-src="../../../../assets/quidence-logo-light.svg?v=f221ab3e9b1a" data-logo-dark-src="../../../../assets/quidence-logo-dark.svg?v=e9b1122a7d0e" alt="Quidence" width="1227" height="310"></a><a class="back" href="../../../../?view=courses#subject-ad01" data-en="← Back to subjects" data-es="← Volver a materias"></a></header><p class="eyebrow">QUIDENCE / CALCULUS</p><h1 data-en="Test your understanding" data-es="Comprueba tu comprensión"></h1><p class="intro" data-en="Choose how you want to explore. Both routes leave room for your own reasoning." data-es="Elige cómo explorar. Ambas rutas dejan espacio para tu propio razonamiento."></p><div class="routes"><article><span class="number">01 / TALK IT THROUGH</span><h2 data-en="Think in motion" data-es="Piensa con una gráfica"></h2><p data-en="Make a claim, move along a graph, choose a viewpoint or write your own, and explain what changed your mind." data-es="Propón una idea, recorre una gráfica, elige una postura o escribe la tuya y explica qué te hizo cambiar de opinión."></p><p class="note" data-en="About 5–8 minutes · English only. Optional local recording and playback; no automatic transcription or AI assessment." data-es="Unos 5–8 minutos · Solo en inglés. Grabación y reproducción local opcionales; sin transcripción automática ni evaluación con IA."></p><a class="primary" id="dialogue-route" data-fixed-language="en" href="../think/?lang=en" data-en="Explore the graph & explain →" data-es="Explora la gráfica y explica →"></a></article><article><span class="number">02 / FOUR PROBLEMS</span><h2 data-en="Work through four problems" data-es="Resuelve cuatro problemas"></h2><p data-en="Use the existing Calculus check to examine limits, derivatives and accumulation. Keep your calculations and explanations." data-es="Usa la evaluación existente de cálculo para examinar límites, derivadas y acumulación. Conserva tus cálculos y explicaciones."></p><p class="note" data-en="The original four-problem check and its saved work remain available." data-es="La evaluación original de cuatro problemas y el trabajo guardado siguen disponibles."></p><a class="primary" id="four-problem-route" href="../../../../diagnostics/?module=ad01&amp;v=187d8c2d401d" data-en="Start the four-problem check →" data-es="Empieza la evaluación de cuatro problemas →"></a></article></div><p class="limits" data-en="These activities offer evidence for reflection, not proof that you have mastered all of Calculus. Your written notes stay in this browser when saving is available." data-es="Estas actividades aportan evidencia para reflexionar; no prueban que domines todo el cálculo. Tus notas escritas quedan en este navegador cuando se pueden guardar."></p><button id="language" type="button">Español</button></main><script src="entry.js?v=cf7f90a0ae19"></script></body></html>
